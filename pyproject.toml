[project]
name = "tracelens"
version = "0.1.0"
description = "Synthetic, evidence-first fraud investigation sandbox"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "langgraph-checkpoint-postgres>=3,<4",
  "mcp>=2.3,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".cache/pytest_cache"
addopts = "--basetemp=.cache/pytest_tmp"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
